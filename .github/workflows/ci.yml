name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.4"

      - name: Report Node.js runtime
        run: |
          node -p 'JSON.stringify({ version: process.version, executable: process.execPath, versions: process.versions })'

      - name: Run validation
        run: npm run check
